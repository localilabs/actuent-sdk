name: Publish to npm
# One click for a release: Actions → Publish to npm → Run workflow → type the new version (e.g. 0.11.0).
# It sets the version in package.json, commits and tags it, builds, publishes @actuent/sdk with npm
# trusted publishing (no token: on npmjs.com, the package's Settings → Trusted publishing trusts this
# repo's "publish.yml") and makes the GitHub release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version, e.g. 0.11.0'
        required: true
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - name: Set the version
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Version must look like 1.2.3"; exit 1; }
          npm version "$VERSION" --no-git-tag-version
          git config user.name "Alfred Murray"
          git config user.email "alfredcasper1010@gmail.com"
          git commit -am "Release $VERSION"
          git tag "v$VERSION"
          git push origin HEAD --tags
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
        run: gh release create "v$VERSION" --title "@actuent/sdk $VERSION" --generate-notes
